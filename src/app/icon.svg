<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32">
  <!-- Les classes ink/accent n'avaient aucune règle associée, et SVG ne pose pas
       de `stroke` par défaut : les deux formes étaient invisibles. Les couleurs
       sont définies ici, avec bascule sombre — les navigateurs honorent
       prefers-color-scheme dans un favicon SVG. -->
  <style>
    .ink { stroke: #172228; }
    .accent { stroke: #1e3a5f; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e8eff1; }
      .accent { stroke: #7fa6d1; }
    }
  </style>
  <circle class="ink" cx="16" cy="16" r="12.5" fill="none" stroke-width="4" stroke-dasharray="5.6 4.22" stroke-dashoffset="2.8"></circle>
  <line class="accent" x1="10" y1="16" x2="22" y2="16" stroke-width="3.5"></line>
</svg>
