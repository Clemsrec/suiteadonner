# Import hebdomadaire du jeu de données des pétitions.
#
# Le fichier est déposé chaque lundi entre 00h50 et 01h15 UTC (relevé sur les
# dépôts du 13/07 au 24/08/2026 dans le bucket d'historisation de data.gouv.fr) ;
# ce workflow le récupère peu après, laisse le contrôle de cohérence décider (un
# CSV non conforme fait échouer le run AVANT toute écriture), puis écrit Firestore
# (petitions + meta/stats + meta/sitemap) et synchronise Algolia — exactement
# `npm run import:petitions`, sans le --env-file local.
#
# Trois passages plutôt qu'un : les crons GitHub partent avec un retard variable,
# et le dépôt a déjà glissé au soir (06/07/2026). Les passages sont sans effet
# tant que le fichier n'a pas changé — l'import compare son en-tête `last-modified`
# à celui de la version déjà importée et sort sans rien écrire s'ils sont égaux.
#
# Auth : compte de service `import-petitions@suiteadonner.iam.gserviceaccount.com`
# (rôle datastore.user uniquement), clé JSON dans le secret GCP_SA_KEY. Un
# compte de service ne subit pas la réauthentification hebdomadaire imposée aux
# comptes utilisateur — c'est la raison d'être de ce workflow, deux lundis
# ayant déjà été manqués à cause d'elle.
#
# L'identifiant d'application Algolia est public par construction (NEXT_PUBLIC_,
# embarqué dans le bundle du site) ; seule la clé Admin est en secret.
#
# En cas d'échec, GitHub notifie par email l'auteur du dernier commit de ce
# fichier. Attention aussi : sur un dépôt public, GitHub suspend les crons
# après 60 jours sans activité du dépôt — un commit quelconque les réactive.

name: Import hebdomadaire des pétitions

on:
  schedule:
    # Lundi 02:20 UTC (04h20 à Paris), une heure après le dépôt habituel, puis
    # deux rattrapages. Minutes décalées : les crons à l'heure pile sont les
    # plus retardés par GitHub.
    - cron: "20 2 * * 1"
    - cron: "20 5 * * 1"
    - cron: "20 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Réimporter même si le fichier officiel est inchangé"
        type: boolean
        default: false

concurrency:
  group: import-petitions
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La clé ne transite que par un fichier du runner, jamais par un argument
      # de commande (les arguments sont visibles dans les logs de process).
      # Le contrôle jq échoue AVANT l'import si le secret est vide ou n'est pas
      # du JSON — un secret mal posé s'est déjà produit et l'erreur générique
      # de google-auth (« Unexpected end of JSON input ») ne désignait pas la cause.
      - name: Écrire et vérifier la clé du compte de service
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          jq -e '.client_email and .private_key' "$RUNNER_TEMP/gcp-key.json" > /dev/null \
            || { echo "::error::Le secret GCP_SA_KEY est vide ou n'est pas une clé JSON de compte de service."; exit 1; }

      - name: Vérifier la cohérence puis importer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          NEXT_PUBLIC_ALGOLIA_APP_ID: B8GIER7BSB
          NEXT_PUBLIC_ALGOLIA_INDEX_NAME: petitions
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: npm run verifier && node scripts/import-petitions.mjs ${{ inputs.force && '--force' || '' }}
